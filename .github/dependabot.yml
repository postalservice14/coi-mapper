version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
    groups:
      web-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "nuget"
    directories:
      - "/mod/CoiMapper.Exporter"
      - "/mod/CoiMapper.SchemaCheck"
    schedule:
      interval: "weekly"
